services:
  # Main FastAPI application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - task_management_backend_network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - .env
    volumes:
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task_management_backend_network

  # DB service
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - PGPORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - task_management_backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - task_management_backend_network
    restart: unless-stopped

volumes:
  task_management_backend_postgres_data:

networks:
  task_management_backend_network:
    name: task_management_backend_network
